name: Desplegar la API

# M4. La API llevaba montada y probada desde M2, pero sin desplegar: no habia a
# quien servir hasta que hubiera login. Ahora lo hay.
#
# ── Antes de que esto haga nada, hay que darle dos secretos ──────────────────
#
# GitHub → Settings → Secrets and variables → Actions → **Secrets**:
#
#   TOKEN_DE_SUPABASE      se saca en supabase.com/dashboard/account/tokens
#   PROYECTO_DE_SUPABASE   el identificador del proyecto (efgtzujwjztihyiwgpwg)
#
# **Los nombres van en castellano, y no es por gusto.** La primera version se
# llamaban `SUPABASE_ACCESS_TOKEN` y `SUPABASE_PROJECT_REF`, y eso llevo a
# ponerlos en el sitio equivocado: en la consola de Supabase, que **reserva el
# prefijo `SUPABASE_`** y los rechaza con un error que no explica por que.
#
# Un nombre que se parece al de otro sitio es un nombre que acabara en otro sitio.
# Estos dos solo pueden ir en GitHub, y ahora se nota al leerlos.
#
# Son los dos primeros secretos del repositorio. Hasta ahora no habia ninguno, y
# era correcto: lo publico iba en Variables y lo secreto vivia solo en Supabase.
# Estos dos son distintos porque son de **nosotros desplegando**, no del producto.
#
# Y en Supabase → Project Settings → Edge Functions → Secrets:
#
#   DATABASE_URL          la del agrupador de sesion, no la directa
#   ORIGENES_PERMITIDOS   https://estook.github.io
#   ENTORNO               produccion
#
# ── Por que no se despliega solo en cada fusion ──────────────────────────────
#
# Porque desplegar la API es lo que pone los datos de verdad al alcance de
# cualquiera con un navegador, y eso se hace **mirando**, no de paso. Se lanza a
# mano desde la pestana Actions.
#
# El dia que haya mas confianza, se le anade el disparador de `push` a `main` y se
# quita este comentario. Antes no.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribe «desplegar» para confirmar'
        required: true
        default: ''

jobs:
  desplegar:
    name: Desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comprobar que se ha escrito la palabra
        run: |
          if [ "${{ inputs.confirmar }}" != "desplegar" ]; then
            echo "Hay que escribir «desplegar» para confirmar."
            exit 1
          fi

      - name: Comprobar que estan los secretos
        run: |
          if [ -z "${{ secrets.TOKEN_DE_SUPABASE }}" ] || [ -z "${{ secrets.PROYECTO_DE_SUPABASE }}" ]; then
            echo "Faltan TOKEN_DE_SUPABASE o PROYECTO_DE_SUPABASE."
            echo ""
            echo "Van en GITHUB, no en Supabase:"
            echo "  Settings -> Secrets and variables -> Actions -> pestana Secrets"
            echo ""
            echo "Esta escrito en docs/pasos-para-cerrar-m4.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      # La version va fija, y no es manía. Con `latest`, la accion le pregunta a
      # la API de GitHub cual es la ultima **sin identificarse**, y eso tiene un
      # limite de peticiones por hora que se agota solo:
      #
      #     Failed to resolve latest Supabase CLI release: rate limit exceeded
      #
      # Eso tumbo el primer intento de desplegar, y no tenia nada que ver con
      # nuestro codigo. Fijandola, el despliegue no depende de cuanta gente haya
      # desplegado hoy. Subirla es cambiar este numero, a proposito y mirando.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # ── Antes de empaquetar nada, que el grafo resuelva ─────────────────────
      #
      # El segundo intento se cayo aqui, y con un error que no se entiende si no
      # sabes de Deno: «failed to create the graph». Lo que pasaba es que el
      # codigo del servidor importa `@estook/utiles`, que en Node resuelve pnpm
      # con los enlaces del espacio de trabajo y **en Deno no resuelve nadie**
      # salvo que este declarado en un mapa de importaciones.
      #
      # Comprobarlo antes cuesta un segundo y falla diciendo que pasa, en vez de
      # dejar que se caiga dentro del empaquetador con «failed to create the
      # graph».
      #
      # Lo comprueba una herramienta nuestra y no un Deno de verdad, **a
      # proposito**: se intento con `deno info` y pasaba igual de verde con el
      # fallo puesto, porque Deno lee el `package.json` del espacio de trabajo y
      # resuelve `@estook/utiles` el solo. El empaquetador de Supabase no hace
      # eso. Una comprobacion que no puede fallar da confianza y no sirve.
      #
      # No necesita instalar nada: es Node pelado, y los ejecutores lo traen.
      - name: Comprobar que el grafo resuelve
        run: node herramientas/revisa-el-grafo-de-deno.mjs

      - name: Desplegar la funcion
        env:
          # Este nombre **si** es el de Supabase, y no se puede cambiar: es la
          # variable que lee su propio programa de linea de comandos. Lo que
          # cambia es de donde sale, que es nuestro secreto en castellano.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.TOKEN_DE_SUPABASE }}
        run: |
          supabase functions deploy api \
            --project-ref "${{ secrets.PROYECTO_DE_SUPABASE }}" \
            --no-verify-jwt

      - name: Comprobar que responde
        run: |
          set -euo pipefail
          DIRECCION="https://${{ secrets.PROYECTO_DE_SUPABASE }}.supabase.co/functions/v1/api/salud"

          # Un despliegue que no responde es un despliegue que no ha pasado.
          for intento in 1 2 3 4 5; do
            if curl -fsS "$DIRECCION" | grep -q "en pie"; then
              echo "La API responde."
              exit 0
            fi
            echo "Todavia no responde; intento $intento de 5."
            sleep 6
          done

          echo "La API no ha respondido despues de cinco intentos."
          exit 1

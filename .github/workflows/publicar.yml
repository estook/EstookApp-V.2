name: Publicar en GitHub Pages

# Decision 0001. Las cuatro aplicaciones comparten dominio y se reparten por
# subcarpeta: web en la raiz, y app, carta y admin debajo.
#
# Antes de que esto funcione hay que activar Pages con origen "GitHub Actions":
#   Settings -> Pages -> Source: GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENTORNO: produccion
      VITE_ENTORNO: ${{ vars.VITE_ENTORNO || 'produccion' }}
      # ── La direccion es estook.com, y va aqui ────────────────────────────
      #
      # Antes se deducia del nombre del repositorio —/EstookApp-V.2/— salvo que
      # alguien declarara una variable. Al poner el dominio propio en Pages, la
      # pagina quedo **en blanco**: el HTML pedia sus ficheros en /EstookApp-V.2/
      # y ahi ya no habia nada. Un fallo que deja la aplicacion caida no puede
      # depender de acordarse de declarar una variable en otra pantalla (0036).
      #
      # Con dominio propio la raiz es "/" y las cuatro aplicaciones cuelgan de
      # ella: estook.com, /app/, /carta/ y /admin/.
      VITE_BASE: '/'
      VITE_APP_URL: 'https://estook.com/'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # M4. Donde vive la API. Mientras no este declarada, la aplicacion publicada
      # **lo dice** en la pantalla de entrar en vez de quedarse cargando: no hay
      # servidor al que preguntar, y eso es la verdad hasta que se despliegue.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      # El DSN de Sentry es publico por naturaleza: viaja dentro del JavaScript
      # que descarga cualquiera. Va en Variables, como las de Supabase. Se acepta
      # tambien desde Secrets por si alguien lo declaro ahi.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
      # La version que se publica es el commit exacto. Con el repositorio enlazado
      # en Sentry, esto es lo que le permite senalar que cambio provoco un fallo.
      VITE_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Construir
        run: pnpm build

      - name: Comprobar el presupuesto de tamano
        run: pnpm tamano

      - name: Las rutas apuntan a donde se publica
        run: pnpm publicacion

      - name: Componer el sitio
        run: |
          set -euo pipefail
          rm -rf _publicacion
          mkdir -p _publicacion

          cp -r apps/web/dist/. _publicacion/
          for aplicacion in app carta admin; do
            mkdir -p "_publicacion/$aplicacion"
            cp -r "apps/$aplicacion/dist/." "_publicacion/$aplicacion/"
          done

          # Pages sirve ficheros, y para lo que no existe sirve UNA pagina: la
          # 404.html de la raiz (las de las carpetas no las usa). Esa pagina es la
          # de la carta (0047): asi estook.com/carta/<local>, la direccion del QR
          # que se imprime, abre la carta de ese local; y cualquier otra direccion
          # que no exista dice que no existe y lleva a estook.com. La carta se
          # construye con rutas absolutas (/carta/assets/...), asi que funciona
          # servida desde cualquier direccion.
          cp _publicacion/carta/index.html _publicacion/404.html

          # El dominio, tambien en lo que se publica: si un dia se pierde el
          # ajuste de Pages, el sitio sigue sabiendo donde vive (0036).
          echo estook.com > _publicacion/CNAME

          # Sin esto, Pages se come las carpetas que empiezan por guion bajo.
          touch _publicacion/.nojekyll

          find _publicacion -maxdepth 2 -name index.html

      # Desde la v4 deja fuera los ficheros que empiezan por punto, y `.nojekyll`
      # es uno: se pide que entren, para que se publique lo mismo que antes.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _publicacion
          include-hidden-files: true

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5

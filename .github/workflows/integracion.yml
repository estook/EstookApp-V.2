name: Integracion continua

# Esta es la puerta. Un pull request con un fallo de tipos no se puede fusionar,
# que es literalmente el criterio de aceptacion de M0.
#
# Para que sirva de verdad hay que marcar estas comprobaciones como obligatorias:
#   Settings -> Branches -> Branch protection rules -> main
#   Require status checks to pass -> "Calidad", "Migraciones reversibles" y "Construccion y presupuestos"

# Corre en cualquier rama, no solo en main: una rama que no se ha comprobado no
# sirve para revisar. Con `push` sobre todas las ramas basta, y asi un pull request
# no dispara dos veces lo mismo.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENTORNO: pruebas
  VITE_ENTORNO: pruebas

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-24.04 # Fijo, como Construccion: el 19-oct-2026 `ubuntu-latest` pasa a la 26 (ver integracion.yml)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm tipos

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm formato

      - name: Reglas de dependencia
        run: pnpm dependencias

      # Lo que lee una persona, en espanol de Espana. Se anadio en M4, despues de
      # ver en un movil de verdad una pantalla que decia «todavia no tengo datos»
      # al lado de otra que decia «¿Donde estas hoy?».
      - name: Textos de pantalla
        run: pnpm textos

      # Las tablas de docs/coste-por-local.md salen de un fichero con los precios. Si
      # alguien cambia un precio o un plan y no repasa el documento, esto lo para.
      - name: El coste por local cuadra con sus cuentas
        run: pnpm coste:comprobar

      # ── El camino que nadie comprobaba ──────────────────────────────────────
      #
      # El primer despliegue de verdad de M4 se cayo con las 532 pruebas en
      # verde, porque **las pruebas corren en Node y la API desplegada corre en
      # Deno**, que resuelve las importaciones de otra manera:
      #
      #     Relative import path "@estook/utiles" not prefixed with / or ./ or ../
      #
      # Habia un camino entero —el que de verdad llega al cliente— que no miraba
      # nadie hasta el momento de desplegar. Ahora se mira en cada cambio.
      #
      # Y lo comprueba una herramienta nuestra de veinte lineas, no un Deno de
      # verdad, **a proposito**. Se intento con `deno info` y no vale: Deno lee
      # el `package.json` del espacio de trabajo y resuelve `@estook/utiles` el
      # solo, asi que pasaba **igual de verde con el fallo puesto**. El
      # empaquetador de Supabase no hace eso, y por eso se cayo.
      #
      # Una comprobacion que no puede fallar es peor que no tenerla, porque da
      # confianza. La nuestra resuelve como resuelve Supabase —mapa y rutas
      # relativas, y nada mas— y esta probada contra el fallo real.
      - name: El grafo de Deno resuelve
        run: pnpm grafo

      - name: Pruebas
        run: pnpm prueba

  # ── Lo de `main` que ya se probó en su rama (19-oct) ──────────────────────
  #
  # Al fusionar, `main` volvía a pasar las 1.050 pruebas de pantalla que la rama
  # acababa de pasar: otros 25 a 35 minutos para comprobar **el mismo código**. Si el
  # árbol de la fusión es idéntico al de la rama fusionada (lo normal: se fusiona
  # sin que `main` se haya movido) y esa rama salió en verde, ya está probado.
  # Si `main` se movió en medio, el árbol cambia y se prueba todo, como siempre.
  # Calidad y Migraciones se corren igual: son baratas.
  ya-probado:
    name: Ya probado en su rama
    runs-on: ubuntu-24.04 # Fijo, como Construccion: el 19-oct-2026 `ubuntu-latest` pasa a la 26 (ver integracion.yml)
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      saltar: ${{ steps.mira.outputs.saltar }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - id: mira
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          saltar=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
              rama=$(git rev-parse HEAD^2)
              # Que la rama pasara las de pantalla: el check que las junta, en verde.
              bien=$(gh api "repos/${{ github.repository }}/commits/$rama/check-runs?check_name=Construccion%20y%20presupuestos" --jq '[.check_runs[] | select(.conclusion == "success")] | length' || echo 0)
              if [ "$bien" -gt 0 ]; then saltar=true; fi
            fi
          fi
          echo "saltar=$saltar" >> "$GITHUB_OUTPUT"
          echo "Ya probado en su rama: $saltar"

  # ── Las de pantalla, en cuatro trozos a la vez (19-oct) ─────────────────────
  #
  # Hasta el 19-oct iban todas en una máquina de cuatro núcleos, con dos hilos: 27 a 33
  # minutos de una vuelta de 35. Cada trozo levanta **su propia** API de pruebas con
  # su propia base, así que no se pisan, y Playwright reparte las pruebas a partes
  # iguales (`--shard`). Las mismas pruebas, los mismos tres navegadores, la misma
  # repetición: solo cambia que van en paralelo.
  pantalla:
    name: Pantallas ${{ matrix.trozo }} de 4
    needs: ya-probado
    if: needs.ya-probado.outputs.saltar != 'true'
    # Con su version de Ubuntu fija, y no `ubuntu-latest` (entrega V): aqui se
    # comparan las capturas de pantalla, y una letra no se pinta igual en otra
    # version del sistema. Si GitHub cambiara el Ubuntu por debajo —lo hace el 19 de
    # octubre de 2026—, las 32 capturas saldrian en rojo sin que la aplicacion haya
    # cambiado en nada. Se sube a mano, y con las capturas rehechas en el mismo cambio.
    runs-on: ubuntu-24.04
    # 45: un trozo bueno va en unos 12 minutos, y bajar los navegadores con el servidor
    # de Ubuntu lento (25 minutos como mucho) cabe sin dejar las pruebas a medias.
    timeout-minutes: 45
    strategy:
      # Que acaben los cuatro aunque uno falle: así se ve todo lo rojo de una vez.
      fail-fast: false
      matrix:
        trozo: [1, 2, 3, 4]
    env:
      # M4: desde que hay login, las pruebas de extremo a extremo necesitan una
      # API a la que entrar, y Vite hornea esta direccion **al construir**. Se
      # declara en el trabajo entero para que quede claro que lo que se construye
      # aqui es para probar, no para publicar: lo que se publica lo construye
      # `publicar.yml`, con la direccion de verdad.
      VITE_API_URL: http://localhost:5177/api
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Construir las cinco aplicaciones
        run: pnpm build

      # Una vez basta: lo construido es lo mismo en los cuatro trozos.
      - name: Presupuesto de tamano
        if: matrix.trozo == 1
        run: pnpm tamano

      - name: Las rutas apuntan a donde se publica
        if: matrix.trozo == 1
        run: pnpm publicacion

      # **Los navegadores necesitan unos cien paquetes de Ubuntu** (fuentes, códecs), y
      # el servidor que usa GitHub a veces los da a cuentagotas: el 26-oct, 3,5 MB en 74
      # segundos, y tres vueltas en rojo sin fallar ninguna prueba (lecciones 226, 231 y
      # 232). Por eso:
      #
      #   · **Se guardan los paquetes ya bajados** en la caché de GitHub, y la vuelta
      #     siguiente los usa sin pedírselos al servidor.
      #   · **Lo lento pero vivo se espera**, no se corta: cortarlo a los cinco minutos
      #     dejó tres trozos en rojo (#146). `apt` solo deja una conexión muerta, sin
      #     recibir nada en 20 s, y la vuelve a pedir.
      #   · Si `apt` falla de verdad, un segundo intento, y antes se corta lo que quede
      #     de él con el candado de `dpkg` cogido (lección 231).
      #   · Con su propio tope (lección 139): si aun así no acaba, falla aquí y lo dice.
      - name: Los paquetes de los navegadores, de una vuelta anterior
        id: paquetes
        uses: actions/cache/restore@v4
        with:
          path: ~/paquetes-de-los-navegadores
          key: navegadores-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: navegadores-ubuntu-24.04-

      - name: Instalar navegadores
        id: navegadores
        timeout-minutes: 25
        run: |
          printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/99-estook > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if ls ~/paquetes-de-los-navegadores/*.deb > /dev/null 2>&1; then
            sudo cp ~/paquetes-de-los-navegadores/*.deb /var/cache/apt/archives/
            echo "Paquetes de una vuelta anterior: $(ls ~/paquetes-de-los-navegadores/*.deb | wc -l)"
          fi
          for intento in 1 2; do
            if pnpm exec playwright install --with-deps chromium webkit; then
              mkdir -p ~/paquetes-de-los-navegadores
              cp /var/cache/apt/archives/*.deb ~/paquetes-de-los-navegadores/ 2> /dev/null || true
              exit 0
            fi
            echo "::warning::Instalar los navegadores ha fallado (intento $intento de 2)."
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock > /dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a || true
          done
          exit 1

      # Se guardan en cuanto se han instalado, aunque luego falle una prueba: lo que
      # tardó en bajar no se vuelve a bajar. Si ya estaban todos, no hace falta.
      - name: Guardar los paquetes de los navegadores, para la vuelta siguiente
        if: steps.navegadores.outcome == 'success' && steps.paquetes.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/paquetes-de-los-navegadores
          key: navegadores-ubuntu-24.04-${{ hashFiles('pnpm-lock.yaml') }}

      # Playwright levanta la API de pruebas (Postgres efimero, migraciones y
      # semillas) antes de las cinco aplicaciones. Esta escrito en
      # `playwright.config.ts`.
      - name: Pruebas de extremo a extremo y presupuesto de velocidad
        run: pnpm prueba:e2e --shard=${{ matrix.trozo }}/4

      # Tambien en verde: una prueba que falla y pasa al repetirse deja la vuelta en
      # verde, y su rastro (el del intento que fallo) solo esta en el informe.
      - name: Guardar el informe, con el rastro de lo que ha fallado o se ha repetido
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: informe-playwright-${{ matrix.trozo }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Las capturas que no han coincidido, o que no existian, con el nombre que
      # tendrian en su sitio (entrega V). Se bajan con `pnpm capturas:traer`, que
      # junta las de los cuatro trozos, se miran, y si son lo que se queria se suben.
      - name: Guardar las capturas nuevas si alguna no coincide
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: capturas-nuevas-${{ matrix.trozo }}
          path: pruebas/e2e/capturas-nuevas/
          if-no-files-found: ignore
          retention-days: 7

  # ── La comprobación obligatoria, con su nombre de siempre ────────────────────
  #
  # La regla de `main` exige «Construccion y presupuestos». Ahora no construye: junta
  # los cuatro trozos y está en verde solo si los cuatro lo están, o si el mismo
  # código ya pasó en su rama (`ya-probado`). Un trozo cancelado o saltado sin
  # motivo es un rojo.
  construccion:
    name: Construccion y presupuestos
    needs: [ya-probado, pantalla]
    if: ${{ always() }}
    runs-on: ubuntu-24.04 # Fijo, como Construccion: el 19-oct-2026 `ubuntu-latest` pasa a la 26 (ver integracion.yml)
    timeout-minutes: 5
    steps:
      - name: Los cuatro trozos, en verde
        run: |
          echo "Ya probado en su rama: ${{ needs.ya-probado.outputs.saltar }}"
          echo "Pantallas: ${{ needs.pantalla.result }}"
          if [ "${{ needs.ya-probado.outputs.saltar }}" = "true" ] && [ "${{ needs.pantalla.result }}" = "skipped" ]; then
            echo "El mismo código ya pasó las pruebas de pantalla en su rama."
            exit 0
          fi
          if [ "${{ needs.pantalla.result }}" != "success" ]; then
            echo "::error::Alguna de las pruebas de pantalla no ha pasado. Mira los trozos de arriba."
            exit 1
          fi

  migraciones:
    name: Migraciones reversibles
    runs-on: ubuntu-24.04 # Fijo, como Construccion: el 19-oct-2026 `ubuntu-latest` pasa a la 26 (ver integracion.yml)
    timeout-minutes: 10
    services:
      postgres:
        # La imagen oficial de Postgres, servida desde la copia pública de Google
        # (`mirror.gcr.io`). Docker Hub limita las descargas sin cuenta y el 9-oct la
        # comprobación cayó por «toomanyrequests» sin haber probado nada; la copia de
        # AWS que la sustituyó cayó igual el 14-oct («Data limit exceeded», dos veces
        # seguidas). La de Google es la misma imagen y no tiene ese tope.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: estook
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:pruebas@localhost:5432/estook
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Migrar
        run: pnpm bd:migrar

      - name: Sembrar
        run: pnpm bd:sembrar

      - name: Sembrar otra vez, que tiene que ser idempotente
        run: pnpm bd:sembrar

      - name: Deshacerlo todo y volver a aplicarlo desde cero
        run: |
          pnpm bd:revertir:todo
          pnpm bd:migrar
          pnpm bd:sembrar

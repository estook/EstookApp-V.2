<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111C1F" />
    <link rel="icon" type="image/svg+xml" href="./marca/favicon.svg" />
    <link rel="apple-touch-icon" href="./marca/apple-touch-icon.png" />
    <!--
      Estook TPV se instala como Estook (0115): con su icono, a pantalla completa y sin la
      barra del navegador. Instalada, la pantalla de cocina puede sonar sin que nadie la
      toque, que es lo que pide una cocina.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      La barra del reloj, **opaca y negra** (la pausa del 5-nov), como la de Estook: con
      «black-translucent» la página iba debajo del reloj y el iPhone, desde iOS 26, ponía
      encima su difuminado (y ese modo tiene un fallo abierto en iOS 26, WebKit 301994).
      Estook TPV siempre es oscuro.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Estook TPV" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Estook TPV: la sala y la cocina en el servicio" />
    <title>Estook TPV</title>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/principal.tsx"></script>
  </body>
</html>

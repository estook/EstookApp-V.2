<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111C1F" />

    <!--
      La marca. El favicon va en SVG, que escala y pesa menos de un kilobyte; el
      PNG solo existe porque iOS lo exige. Los genera
      herramientas/iconos-de-marca.mjs a partir del mismo simbolo, y los deja en
      public/marca de cada aplicacion: no se editan a mano.
    -->
    <link rel="icon" type="image/svg+xml" href="./marca/favicon.svg" />
    <link rel="apple-touch-icon" href="./marca/apple-touch-icon.png" />

    <!--
      Añadir a la pantalla de inicio, que en una cocina es como se usa esto.

      Los dos iconos de 192 y 512 llevaban generados desde M3 y **no habia
      manifiesto que los usara**: en Android no salia «Instalar aplicacion» y en
      iOS se abria dentro de Safari, con su barra de direcciones comiendose una
      franja de una pantalla que ya es pequena.

      "display": "standalone" del manifiesto es lo que la abre sin barra del
      navegador, y "scope" y "start_url" van relativos porque esto se publica en
      GitHub Pages colgando de una subcarpeta.

      Lo que esto **no** trae todavia son las notificaciones push: hacen falta un
      trabajador de servicio y el permiso de cada persona, y eso llega con el
      modulo de notificaciones. Pero sin manifiesto no habrian podido llegar
      nunca —iOS solo las da a lo que esta en la pantalla de inicio—, asi que
      este es el primer paso y no un adorno.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Estook" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="La aplicacion: el Panel y sus ocho apps" />
    <title>Estook</title>
    <!--
      Lo que se ve antes de que llegue el código (repaso del 16-oct): el fondo de la
      app y su logo, en vez de una pantalla vacía. React lo sustituye al pintar. Va
      aquí, en la página, porque es lo único que hay mientras el móvil lee el código.

      **En el tema del aparato** (18-oct): `tema-al-arrancar.js` pone `data-tema` en el
      <html> antes de pintar, y aquí el fondo y el logo lo siguen. Antes era siempre
      claro, y en un iPhone con el oscuro se veía el logo sobre claro, un salto a
      oscuro y una franja clara abajo (este fondo del <html>, que manda sobre el de la
      app porque esto no va en ninguna capa). Los colores son los de `temas.css`.
    -->
    <script src="./tema-al-arrancar.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #f1efea;
      }
      html[data-tema='oscuro'],
      html[data-tema='oscuro'] body,
      html[data-tema='sistema'],
      html[data-tema='sistema'] body {
        background: #15181c;
      }
      .arrancando {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .arrancando img {
        width: 132px;
        height: auto;
        opacity: 0.9;
      }
      .arrancando .en-oscuro,
      html[data-tema='oscuro'] .arrancando .en-claro,
      html[data-tema='sistema'] .arrancando .en-claro {
        display: none;
      }
      html[data-tema='oscuro'] .arrancando .en-oscuro,
      html[data-tema='sistema'] .arrancando .en-oscuro {
        display: block;
      }
      @media (prefers-color-scheme: light) {
        html[data-tema='sistema'],
        html[data-tema='sistema'] body {
          background: #f1efea;
        }
        html[data-tema='sistema'] .arrancando .en-claro {
          display: block;
        }
        html[data-tema='sistema'] .arrancando .en-oscuro {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="raiz">
      <div class="arrancando" aria-hidden="true">
        <img class="en-claro" src="./marca/estook-logo.png" alt="" />
        <img class="en-oscuro" src="./marca/estook-logo-oscuro.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/principal.tsx"></script>
  </body>
</html>
